<title>Карьера футболиста</title>
<style>
/* Layout: one-screen app. Player card on top, scrolling match log in the middle, action buttons pinned at the bottom. */
:root {
  --bg: #0b1620;
  --surface: #12232f;
  --surface-2: #1b3446;
  --line: #26485c;
  --fg: #e8f1f5;
  --muted: #8fa9b8;
  --accent: #f0b429;
  --accent-text: #f0b429;
  --on-accent: #1a1202;
  --good: #4ade80;
  --bad: #f87171;
  --info: #7dd3fc;
  --moment: #c4b5fd;
  --font-display: "Bahnschrift", "Roboto Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef3f6; --surface: #ffffff; --surface-2: #e0eaf0; --line: #c2d2dc;
    --fg: #12232f; --muted: #50707f; --accent: #e0a010; --accent-text: #8a5a00;
    --on-accent: #1a1202; --good: #15803d; --bad: #b91c1c; --info: #0369a1; --moment: #6d28d9;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef3f6; --surface: #ffffff; --surface-2: #e0eaf0; --line: #c2d2dc;
  --fg: #12232f; --muted: #50707f; --accent: #e0a010; --accent-text: #8a5a00;
  --on-accent: #1a1202; --good: #15803d; --bad: #b91c1c; --info: #0369a1; --moment: #6d28d9;
  color-scheme: light;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; }
* { box-sizing: border-box; }

#app {
  height: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* --- player card --- */
#hud {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.brand {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--accent-text);
}
#player { display: flex; flex-direction: column; gap: 8px; }
.p-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.p-main { min-width: 0; }
#pName {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 24px;
  line-height: 1.05;
  overflow-wrap: anywhere;
}
#pMeta { color: var(--muted); font-size: 13px; margin-top: 2px; }
.ovr {
  flex: none;
  text-align: center;
  min-width: 64px;
  padding: 4px 10px 5px;
  border: 1px solid var(--accent);
  border-radius: 8px;
}
.ovr b {
  display: block;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 32px;
  line-height: 1;
  color: var(--accent-text);
  font-variant-numeric: tabular-nums;
}
.ovr span { font-size: 10px; letter-spacing: .12em; color: var(--muted); }
.chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px; }
.chip { min-width: 0; background: var(--surface-2); border-radius: 8px; padding: 5px 9px; }
.chip span { display: block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.chip b { display: block; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* --- log --- */
#log {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 4px 2px 8px;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}
.ln { padding: 2px 0; line-height: 1.45; font-size: 15px; overflow-wrap: anywhere; }
.sp { height: 10px; }
.rule { height: 1px; background: var(--line); margin: 10px 0 4px; }
.ln.head {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 17px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--info);
  padding-top: 8px;
}
.ln.gold { color: var(--accent-text); font-weight: 600; padding-top: 6px; }
.ln.good { color: var(--good); }
.ln.bad { color: var(--bad); }
.ln.moment { color: var(--moment); font-weight: 600; }
.ln.match { font-weight: 600; font-variant-numeric: tabular-nums; }
.ln.muted { color: var(--muted); }

/* --- action bar --- */
#bar {
  display: grid;
  gap: 6px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
  max-height: 46%;
  overflow-y: auto;
}
#bar[aria-busy="true"] { opacity: .55; pointer-events: none; }
.btn {
  min-height: 40px;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--fg);
  font: 500 14px/1.2 var(--font-body);
  text-wrap: balance;
  cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, #nameInput:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
.btn.auto { background: transparent; border-style: dashed; color: var(--accent-text); }
.entry { display: flex; gap: 6px; }
#nameInput {
  flex: 1;
  min-width: 0;
  min-height: 40px;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--fg);
  font: 500 16px var(--font-body);
}
.entry .btn { flex: none; padding-inline: 20px; }
@media (prefers-reduced-motion: no-preference) {
  .btn { transition: border-color .12s ease; }
}
</style>

  }

  function clear() { logEl.textContent = ""; }

  function hudShow(p) {
    $("player").hidden = false;
    $("pName").textContent = p.name;
    $("pMeta").textContent = p.pos + " · " + p.age + " лет · " + (p.height || 180) + " см, " + (p.weight || 78) + " кг · сборная: " + p.nation;
    $("pOvr").textContent = overall(p);
    $("pClub").textContent = p.club.n + " · " + p.club.lg;
    $("pRep").textContent = p.rep;
    $("pMoney").textContent = p.money + " тыс. €";
  }
  function hudHide() { $("player").hidden = true; }

  function choose(opts) {
    return new Promise(function (resolve) {
      barEl.textContent = "";
      barEl.removeAttribute("aria-busy");
      var n = opts.length;
      var maxLen = Math.max.apply(null, opts.map(function (o) { return o[0].length; }));
      var cols = n <= 1 ? 1 : n <= 4 ? 2 : n <= 9 ? 3 : 4;
      if (maxLen > 26) cols = Math.min(cols, 2);
      if (maxLen > 40) cols = 1;
      barEl.style.gridTemplateColumns = "repeat(" + cols + ", minmax(0, 1fr))";
      var done = false;
      opts.forEach(function (o) {
        var b = document.createElement("button");
        b.type = "button";
        var cls = "btn";
        if (o[1] === "AUTO") cls += " auto";
        else if (/^(Следующий|Продолжить)/.test(o[0])) cls += " primary";
        b.className = cls;
        b.textContent = o[0];
        b.addEventListener("click", function () {
          if (done) return;
          done = true;
          barEl.setAttribute("aria-busy", "true");
          resolve(o[1]);
        });
        barEl.appendChild(b);
      });
    });
  }

  function entry() {
    return new Promise(function (resolve) {
      barEl.textContent = "";
      barEl.removeAttribute("aria-busy");
      barEl.style.gridTemplateColumns = "minmax(0, 1fr)";
      var wrap = document.createElement("div");
      wrap.className = "entry";
      var inp = document.createElement("input");
      inp.id = "nameInput";
      inp.type = "text";
      inp.maxLength = 24;
      inp.placeholder = "Имя игрока";
      inp.setAttribute("aria-label", "Имя игрока");
      inp.autocomplete = "off";
      var ok = document.createElement("button");
      ok.type = "button";
      ok.className = "btn primary";
      ok.textContent = "OK";
      var done = false;
      function go() {
        if (done) return;
        done = true;
        barEl.setAttribute("aria-busy", "true");
        resolve(inp.value.trim() || "Игрок");
      }
      ok.addEventListener("click", go);
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
      wrap.appendChild(inp);
      wrap.appendChild(ok);
      barEl.appendChild(wrap);
      try { inp.focus(); } catch (e) { /* ignore */ }
    });
  }

  var UI = { say: say, clear: clear, choose: choose, entry: entry };

  /* ================= ЛОГИКА ================= */
  function overall(p) {
    var w = WEIGHTS[p.pos];
    var sum = 0;
    Object.keys(w).forEach(function (k) { sum += p[k] * w[k]; });
    return Math.floor(sum);
  }
  function seasonLabel(p) { return p.year + "/" + String(p.year + 1).slice(-2); }
  function salary(p, club) { return Math.floor(Math.pow(club.s, 2) * overall(p) / 100 * (1 + p.rep / 100)); }
  function out() { if (!state.auto) say.apply(null, arguments); }

  async function ask(opts) {
    if (state.auto) return pick(opts)[1];
    var v = await UI.choose(opts.concat([["Авто до конца", "AUTO"]]));
    if (v === "AUTO") {
      state.auto = true;
      say("Автосимуляция включена");
      return pick(opts)[1];
    }
    return v;
  }

  async function chooseMode() {
    var m = await UI.choose([["Играть матчи самому", "1"], ["Автосимуляция", "2"]]);
    state.auto = (m === "2");
  }

  /* ---------- Рост по типу карьеры ---------- */
  function growthRange(p) {
    var a = p.age, arch = p.arch || "normal", boomed = !!p.boomed;
    if (arch === "early") {
      if (a <= 19) return [2, 5];
      if (a <= 23) return [1, 3];
      if (a <= 27) return [0, 2];
      if (a <= 30) return [0, 1];
      return [0, 0];
    }
    if (arch === "late") {
      if (!boomed) return a <= 20 ? [0, 2] : [1, 3];
      if (a <= 31) return [3, 5];
      if (a <= 34) return [0, 2];
      return a <= 36 ? [0, 1] : [0, 0];
    }
    if (arch === "hidden") {
      if (!boomed) return [0, 1];
      if (a <= (p.boom || 21) + 5) return [2, 4];
      if (a <= 30) return [1, 3];
      if (a <= 33) return [0, 1];
      return [0, 0];
    }
    if (a <= 21) return [2, 4];
    if (a <= 25) return [1, 3];
    if (a <= 29) return [1, 2];
    if (a <= 32) return [0, 1];
    return [0, 0];
  }
  function passiveRange(p) {
    var a = p.age, arch = p.arch || "normal", boomed = !!p.boomed;
    if (arch === "early") {
      if (a <= 20) return [0, 3];
      return a <= 23 ? [0, 1] : [0, 0];
    }
    if (arch === "late") {
      if (!boomed) return [0, 1];
      return a <= 31 ? [1, 3] : [0, 0];
    }
    if (arch === "hidden") {
      if (boomed && a <= (p.boom || 21) + 5) return [0, 2];
      return [0, 0];
    }
    return a <= 22 ? [0, 2] : [0, 0];
  }

  /* ---------- Рост и вес ---------- */
  function bodyDev(p) {
    // отклонение веса от "нормы" (рост - 100) в десятках кг
    return ((p.weight || 78) - ((p.height || 180) - 100)) / 10;
  }
  function applyBody(p) {
    var h = ((p.height || 180) - 180) / 10, wd = bodyDev(p), m;
    if (p.pos === "Вратарь") {
      m = { aerial: h * 4, handling: h, position: h, reflex: -h - wd, agility: -h * 2 - wd * 2.5 };
    } else {
      m = { power: h * 3 + wd * 2, pace: -h * 2 - wd * 3, dribble: -h * 2, defense: h * 1.5 };
    }
    Object.keys(m).forEach(function (k) { p[k] = clamp(p[k] + Math.round(m[k]), 25, 99); });
  }

  /* ---------- Создание игрока ---------- */
  async function newPlayer() {
    UI.clear();
    say("=== НОВАЯ КАРЬЕРА ===");
    say("Как зовут игрока?");
    var name = await UI.entry();
    say("Выбери позицию:");
    var pi = await UI.choose(POS_LIST.map(function (x, i) { return [x, String(i)]; }));
    var pos = POS_LIST[parseInt(pi, 10)];

    say(pos === "Вратарь"
      ? "Выбери рост (вратарю высокий рост помогает на выходах и в воздухе):"
      : "Выбери рост (выше: сильнее и надёжнее в защите, ниже: быстрее и ловчее):");
    var heights = [165, 170, 175, 180, 185, 190, 195, 200, 205];
    var height = parseInt(await UI.choose(heights.map(function (h) { return [h + " см", String(h)]; })), 10);
    var ideal = height - 100;
    say("Выбери вес (тяжелее: больше силы, но меньше скорости и подвижности):");
    var weights = [];
    for (var w0 = ideal - 15; w0 <= ideal + 25; w0 += 5) weights.push(w0);
    var weight = parseInt(await UI.choose(weights.map(function (w) { return [w + " кг", String(w)]; })), 10);

    say("Выбери тип карьеры:");
    var ar = await UI.choose([
      ["Обычный путь", "normal"],
      ["Вундеркинд (рано растёт, рано стареет)", "early"],
      ["Поздний расцвет (топ в 25-30 лет)", "late"],
      ["Нераскрытый талант (долго в тени, потом прорыв)", "hidden"],
      ["Случайно (судьба скрыта)", "random"]
    ]);
    var arch;
    if (ar === "random") {
      arch = wchoice(["normal", "early", "late", "hidden"], [50, 15, 20, 15]);
      say("Тип карьеры скрыт. Посмотрим, что приготовила судьба...");
    } else {
      arch = ar;
      say("Тип карьеры:", ARCH_NAMES[arch]);
    }

    say("За какую сборную будешь играть? Сначала континент:");
    var cont = await UI.choose(CONTINENTS.map(function (c) { return [c, c]; }));
    say("Выбери сборную:");
    var nation = await UI.choose(NATIONS.filter(function (n) { return n.c === cont; }).map(function (n) { return [n.n, n.n]; }));

    var club = null;
    while (!club) {
      say("Выбери лигу, где начнёшь карьеру:");
      var lg = await UI.choose([["Случайный клуб (" + START_LEAGUE + ")", "RANDOM"]].concat(LEAGUE_NAMES.map(function (x) { return [x, x]; })));
      if (lg === "RANDOM") {
        club = pick(CLUBS.filter(function (c) { return c.lg === START_LEAGUE; }));
        break;
      }
      say("Выбери клуб:");
      var cn = await UI.choose(LEAGUES[lg].map(function (c) { return [c[0] + " (" + c[1] + ")", c[0]]; }).concat([["← Назад", "BACK"]]));
      if (cn === "BACK") continue;
      club = CLUBS.filter(function (c) { return c.n === cn && c.lg === lg; })[0];
    }

    var p = {
      name: name, pos: pos, nation: nation, age: 16, year: 2026,
      height: height, weight: weight,
      pot: rnd(POT_RANGE[arch][0], POT_RANGE[arch][1]), rep: 0, money: 0,
      extra: 0, doc: false, qual: null,
      arch: arch, boomed: false,
      boom: arch === "late" ? rnd(21, 24) : arch === "hidden" ? rnd(19, 22) : 99,
      club: { n: club.n, s: club.s, lg: club.lg },
      career: { matches: 0, goals: 0, assists: 0, saves: 0, clean: 0, caps: 0, nat_goals: 0, ballon: 0, seasons: 0, trophies: [], history: [] }
    };
    var sr = START_RANGE[arch];
    keysOf(p).forEach(function (k) {
      var v = rnd(sr[0], sr[1]);
      if (WEIGHTS[pos][k] >= 0.15) v += rnd(6, 12);
      p[k] = v;
    });
    applyBody(p);
    if (club.s - overall(p) > 25) {
      say("!!! Ты намного слабее состава клуба. Скорее всего, сядешь на скамейку.");
    }
    return p;
  }

  function showPlayer(p) {
    hudShow(p);
    say(p.name, "|", p.pos, "|", p.age, "лет |", (p.height || 180) + " см,", (p.weight || 78) + " кг | сборная:", p.nation);
    say("Клуб:", p.club.n, "[" + p.club.lg + "]", "| Рейтинг:", overall(p), "| Репутация:", p.rep);
    say("Деньги:", p.money, "тыс. €");
  }

  /* ---------- Тренировки ---------- */
  function gainFor(p, k) {
    var r = growthRange(p);
    var g = rnd(r[0], r[1]);
    if (p[k] >= p.pot) g = 0;
    return Math.min(g, 99 - p[k]);
  }

  async function train(p) {
    var n = 3 + p.extra;
    p.extra = 0;
    var before = overall(p);
    var pr = passiveRange(p);
    if (pr[1] > 0) {
      keysOf(p).forEach(function (k) {
        if (p[k] < p.pot) p[k] = Math.min(99, p[k] + rnd(pr[0], pr[1]));
      });
    }
    say("\n--- ТРЕНИРОВКИ --- занятий:", n);
    for (var i = 0; i < n; i++) {
      say("Занятие " + (i + 1) + "/" + n + ": что качаем?");
      var k = await UI.choose(keysOf(p).map(function (x) { return [STATS[x] + " " + p[x], x]; }));
      var g = gainFor(p, k);
      p[k] += g;
      say(STATS[k], "+" + g);
    }
    say("Рейтинг:", before, "->", overall(p));
    hudShow(p);
  }

  /* ---------- Матч ---------- */
  async function moment(p) {
    var pos = p.pos;
    var minute = rnd(3, 89);
    var r = { goal: 0, assist: 0, save: 0, d: 0, bonus: 0 };
    if (pos === "Вратарь") {
      out("\n" + minute + "' Соперник бьёт по твоим воротам!");
      var g = await ask([["Прыжок в угол", "1"], ["Выйти навстречу", "2"], ["Принять на руки", "3"]]);
      var gs = { "1": p.reflex, "2": (p.position + p.agility) / 2, "3": (p.handling + p.aerial) / 2 }[g];
      if (Math.random() < 0.2 + gs / 140) {
        out(pick(["Сейв! Вратарь вытащил мяч!", "Невероятный сейв!", "Ты забрал мяч уверенно."]));
        r.save = 1; r.d = 0.9;
      } else {
        out("Гол в твои ворота...");
        r.d = -0.7; r.bonus = -0.08;
      }
      return r;
    }
    if (Math.random() < ATK_SHARE[pos]) {
      out("\n" + minute + "' Ты в атаке, мяч у тебя!");
      var c = await ask([["Удар", "1"], ["Пас", "2"], ["Обыграть", "3"]]);
      var fwd = pos === "Нападающий" ? 0.04 : 0;
      if (c === "1") {
        if (Math.random() < 0.10 + p.shot / 220 + fwd) {
          out("ГООООЛ!");
          r.goal = 1; r.d = 1.3; r.bonus = 0.10;
        } else {
          out(pick(["Вратарь отбил!", "Мимо ворот!", "Штанга!"]));
          r.d = -0.1;
        }
      } else if (c === "2") {
        if (Math.random() < 0.10 + p.pass / 220) {
          out("Партнёр забил после твоего паса! Ассист!");
          r.assist = 1; r.d = 1.0; r.bonus = 0.10;
        } else {
          out("Пас перехвачен...");
          r.d = -0.3;
        }
      } else {
        if (Math.random() < 0.2 + p.dribble / 200) {
          out("Ты обыграл защитника!");
          if (Math.random() < 0.40 + p.shot / 400) {
            out("...и забил! ГОЛ!");
            r.goal = 1; r.d = 1.3; r.bonus = 0.10;
          } else {
            out("...но удар заблокирован.");
            r.d = 0.4;
          }
        } else {
          out("Потеря мяча.");
          r.d = -0.4;
        }
      }
    } else {
      out("\n" + minute + "' Соперник атакует твои ворота!");
      var c2 = await ask([["Отбор", "1"], ["Перехват", "2"], ["Силовая борьба", "3"]]);
      var stat = { "1": p.defense, "2": (p.defense + p.pace) / 2, "3": (p.defense + p.power) / 2 }[c2];
      if (Math.random() < 0.2 + stat / 140) {
        out("Атака сорвана! Отличная игра!");
        r.d = 0.7;
      } else {
        out("Соперник прорвался...");
        r.d = -0.5; r.bonus = -0.07;
      }
    }
    return r;
  }

  function teamResult(cstr, opp, rating, bonus) {
    var pw = 0.42 + (cstr - opp) / 110 + bonus;
    if (rating) pw += (rating - 6) * 0.03;
    pw = clamp(pw, 0.08, 0.85);
    var r = Math.random();
    if (r < pw) return "W";
    if (r < pw + 0.22) return "D";
    return "L";
  }

  function makeScore(res, mg) {
    var gf, ga;
    if (res === "W") {
      gf = Math.max(rnd(1, 3), mg);
      ga = rnd(0, gf - 1);
    } else if (res === "D") {
      gf = Math.max(rnd(0, 2), mg);
      ga = gf;
    } else {
      gf = mg ? mg : rnd(0, 1);
      ga = gf + rnd(1, 2);
    }
    return [gf, ga];
  }

  function koResult(res, cstr, ostr) {
    if (res === "W") return true;
    if (res === "L") return false;
    return Math.random() < clamp(0.5 + (cstr - ostr) / 200, 0.35, 0.65);
  }

  function getRole(p, s) {
    var diff = overall(p) - s + rnd(-4, 4);
    if (diff >= -6) return "starter";
    if (diff >= -16) return "rot";
    return "bench";
  }

  async function playMatch(p, role, my, opp, ostr, cstr, tag, ko) {
    var n = { starter: p.pos === "Вратарь" ? 3 : 2, rot: 1, bench: 0, out: 0 }[role];
    if (role === "bench" && Math.random() < 0.3) n = 1;
    out("\n=== " + tag + ": " + my + " - " + opp + " (сила " + ostr + ") ===");
    if (n === 0) out("Ты на скамейке...");
    var mg = 0, ma = 0, sv = 0, d = 0, bonus = 0;
    for (var i = 0; i < n; i++) {
      var r = await moment(p);
      mg += r.goal; ma += r.assist; sv += r.save || 0; d += r.d; bonus += r.bonus;
    }
    var rating = null;
    if (n > 0) rating = clamp(6.2 + d + (Math.random() * 0.6 - 0.3), 3.5, 10.0);
    var res = teamResult(cstr, ostr, rating, bonus);
    var sc = makeScore(res, mg);
    var adv = null;
    if (ko) adv = koResult(res, cstr, ostr);
    var line = tag + ": " + my + " " + sc[0] + ":" + sc[1] + " " + opp;
    if (ko && res === "D") line += " (по пенальти " + (adv ? "победа" : "поражение") + ")";
    if (rating) line += " | оценка " + rating.toFixed(1);
    var cs = (p.pos === "Вратарь" && n > 0 && sc[1] === 0) ? 1 : 0;
    if (mg) line += " | голов: " + mg;
    if (ma) line += " | ассистов: " + ma;
    if (sv) line += " | сейвов: " + sv;
    if (cs) line += " | сухой матч";
    say(line);
    return { res: res, mg: mg, ma: ma, sv: sv, cs: cs, rating: rating, adv: adv };
  }

  /* ---------- Еврокубки ---------- */
  function qualFor(league, place) {
    if (EURO_TOP.indexOf(league) >= 0) {
      if (place <= 4) return "ЛЧ";
      if (place === 5) return "ЛЕ";
      if (place === 6) return "ЛК";
    } else if (EURO_OTHER.indexOf(league) >= 0) {
      if (place <= 2) return "ЛЧ";
      if (place === 3) return "ЛЕ";
      if (place === 4) return "ЛК";
    }
    return null;
  }

  function euroComp(p) {
    var club = p.club, q = p.qual;
    if (q && q[0] === club.n) return q[1];
    var lg = club.lg;
    if (EURO.indexOf(lg) < 0) return null;
    var ranked = CLUBS.filter(function (c) { return c.lg === lg; })
      .map(function (c) { return { c: c, k: c.s + rnd(-5, 5) }; })
      .sort(function (a, b) { return b.k - a.k; });
    var place = 0;
    ranked.forEach(function (x, i) { if (x.c.n === club.n) place = i + 1; });
    return qualFor(lg, place);
  }

  async function euroCup(p, comp, role) {
    var club = p.club, cstr = club.s;
    var allc = CLUBS.filter(function (c) { return EURO.indexOf(c.lg) >= 0 && c.n !== club.n; })
      .sort(function (a, b) { return b.s - a.s; });
    var rg = { "ЛЧ": [0, 26], "ЛЕ": [14, 44], "ЛК": [28, 70] }[comp];
    var pool = allc.slice(rg[0], rg[1]);
    say("\n" + "=".repeat(20));
    say(">>>", COMP_NAMES[comp].toUpperCase(), seasonLabel(p), "|", club.n);
    var res = { comp: comp, stage: "", won: false, goals: 0, assists: 0, saves: 0, clean: 0, ratings: [], bonus: 0 };
    function add(r) {
      res.goals += r.mg; res.assists += r.ma; res.saves += r.sv; res.clean += r.cs;
      if (r.rating) res.ratings.push(r.rating);
    }
    var pts = 0;
    var opps = sample(pool, 4);
    for (var k = 0; k < opps.length; k++) {
      var o = opps[k];
      var r = await playMatch(p, role, club.n, o.n, o.s, cstr, comp + " этап " + (k + 1) + "/4");
      add(r);
      pts += PTS[r.res];
    }
    if (pts < 4) {
      res.stage = "вылет на групповом этапе";
      return finishCup(p, res);
    }
    say("Команда вышла в плей-офф!");
    var stages = ["1/8 финала", "1/4 финала", "1/2 финала", "ФИНАЛ"];
    for (var i = 0; i < stages.length; i++) {
      var st = stages[i];
      var o2 = pick(pool);
      var r2 = await playMatch(p, role, club.n, o2.n, o2.s, cstr, comp + " " + st, true);
      add(r2);
      if (!r2.adv) {
        res.stage = st === "ФИНАЛ" ? "проигран финал" : "вылет в " + st;
        return finishCup(p, res);
      }
    }
    res.won = true;
    res.stage = "ПОБЕДА!";
    return finishCup(p, res);
  }

  function finishCup(p, res) {
    var comp = res.comp, label = seasonLabel(p), club = p.club.n;
    if (res.won) {
      p.career.trophies.push(COMP_NAMES[comp] + " " + label + " (" + club + ")");
      p.rep += { "ЛЧ": 20, "ЛЕ": 10, "ЛК": 6 }[comp];
      res.bonus = { "ЛЧ": 14, "ЛЕ": 6, "ЛК": 3 }[comp];
      say("\n*** ВАША КОМАНДА ВЫИГРАЛА", COMP_NAMES[comp].toUpperCase() + "! ***");
    } else if (res.stage === "проигран финал") {
      p.rep += { "ЛЧ": 6, "ЛЕ": 3, "ЛК": 2 }[comp];
      res.bonus = comp === "ЛЧ" ? 5 : 0;
    }
    return res;
  }

  /* ---------- Сезон ---------- */
  async function playSeason(p) {
    var club = p.club, cstr = club.s;
    var role = getRole(p, cstr);
    say("\n=== СЕЗОН", seasonLabel(p), "|", club.n, "[" + club.lg + "] ===");
    say({
      starter: "Ты основной игрок команды.",
      rot: "Ты в ротации: играешь не в каждом матче.",
      bench: "Ты сидишь на скамейке. Качайся или меняй клуб."
    }[role]);

    var mates = shuffle(CLUBS.filter(function (c) { return c.lg === club.lg && c.n !== club.n; })).slice(0, 11);
    var names = mates.map(function (c) { return c.n; });
    var strs = mates.map(function (c) { return c.s; });

    var missed = new Set();
    if (Math.random() < (p.doc ? 0.07 : 0.15) + (Math.abs(bodyDev(p)) >= 2.5 ? 0.04 : 0)) {
      var idx = [];
      for (var q = 0; q < 11; q++) idx.push(q);
      sample(idx, rnd(2, 5)).forEach(function (x) { missed.add(x); });
      say("!!! Ты получил травму и пропустишь несколько матчей");
    }
    p.doc = false;

    await chooseMode();

    var pts = 0, goals = 0, assists = 0, saves = 0, clean = 0, played = 0;
    var ratings = [];
    for (var i = 0; i < 11; i++) {
      var opp = names[i], ostr = strs[i];
      if (missed.has(i)) {
        var rs = teamResult(cstr, ostr, null, 0);
        var sc = makeScore(rs, 0);
        pts += PTS[rs];
        say("Матч " + (i + 1) + ":", club.n, sc[0] + ":" + sc[1], opp, "| травма");
        continue;
      }
      var r = await playMatch(p, role, club.n, opp, ostr, cstr, "Матч " + (i + 1) + "/11");
      pts += PTS[r.res];
      goals += r.mg;
      assists += r.ma;
      saves += r.sv;
      clean += r.cs;
      if (r.rating) { ratings.push(r.rating); played += 1; }
    }

    // таблица лиги
    var mean = (strs.reduce(function (a, b) { return a + b; }, 0) + cstr) / 12;
    var others = strs.map(function (s) { return clamp(Math.trunc(gauss(15 + (s - mean) * 0.5, 4)), 0, 33); });
    var place = 1 + others.filter(function (x) { return x > pts; }).length;
    var champ = place === 1;

    // еврокубок
    var comp = euroComp(p);
    var cupRes = null;
    if (comp) {
      var crRole = (missed.size && Math.random() < 0.5) ? "out" : role;
      cupRes = await euroCup(p, comp, crRole);
      goals += cupRes.goals;
      assists += cupRes.assists;
      saves += cupRes.saves;
      clean += cupRes.clean;
      ratings = ratings.concat(cupRes.ratings);
      played += cupRes.ratings.length;
    }
    p.qual = [club.n, qualFor(club.lg, place)];

    state.auto = false;

    // кубок страны
    var cup = Math.random() < clamp((cstr - 35) / 150, 0.02, 0.4);

    var avg = ratings.length ? ratings.reduce(function (a, b) { return a + b; }, 0) / ratings.length : 0;
    var label = seasonLabel(p);
    var c = p.career;
    c.matches += played;
    c.goals += goals;
    c.assists += assists;
    c.saves = (c.saves || 0) + saves;
    c.clean = (c.clean || 0) + clean;
    c.seasons += 1;
    if (champ) c.trophies.push("Чемпион лиги " + label + " (" + club.n + ")");
    if (cup) c.trophies.push("Кубок страны " + label + " (" + club.n + ")");

    var gain = 0;
    if (avg) gain = Math.trunc((avg - 6.2) * 6 + goals * 0.8 + assists * 0.4 + saves * 0.15 + clean * 1.2);
    gain += (champ ? 8 : 0) + (cup ? 4 : 0);
    gain = clamp(gain, -3, 40);
    p.rep = Math.max(0, p.rep + gain);

    var sal = salary(p, club);
    p.money += sal;

    say("\n--- ИТОГИ СЕЗОНА ---");
    say("Место в лиге:", place, "из 12 | очки:", pts);
    if (p.pos === "Вратарь") {
      say("Матчей:", played, "| Сейвы:", saves, "| Сухие матчи:", clean, "| Ср. оценка:", avg.toFixed(1));
    } else {
      say("Матчей:", played, "| Голы:", goals, "| Ассисты:", assists, "| Ср. оценка:", avg.toFixed(1));
    }
    if (champ) say("*** ВАША КОМАНДА - ЧЕМПИОН! ***");
    say("Кубок страны:", cup ? "ПОБЕДА!" : "вылет");
    if (cupRes) say(COMP_NAMES[comp] + ":", cupRes.stage);
    say("Репутация:", (gain >= 0 ? "+" : "") + gain, "| Зарплата за сезон:", sal, "тыс. €");

    var gk = p.pos === "Вратарь";
    c.history.push(label + " " + club.n + " | " + (gk ? saves + " сейвов " + clean + " сухих" : goals + "г " + assists + "а") + " | оценка " + avg.toFixed(1));

    // Приз лучшему вратарю
    if (gk && avg >= 7.0 && played >= 10 && Math.random() < 0.5) {
      c.trophies.push("Приз Яшина " + label);
      p.rep += 6;
      say("\n*** ТЫ ПОЛУЧИЛ ПРИЗ ЯШИНА: ЛУЧШИЙ ВРАТАРЬ СЕЗОНА! ***");
    }

    // Золотой мяч
    if (cstr >= 80 && avg) {
      var score = (gk ? saves * 0.4 + clean * 3 : goals * 2 + assists) + avg * 5 + (champ ? 10 : 0) + overall(p) / 2 + p.rep / 4 + (Math.random() * 12 - 6);
      if (cupRes) score += cupRes.bonus;
      if (score > (gk ? 150 : 135)) {
        c.ballon += 1;
        c.trophies.push("ЗОЛОТОЙ МЯЧ " + label);
        p.rep += 20;
        say("\n*** ТЫ ВЫИГРАЛ ЗОЛОТОЙ МЯЧ! ***");
      }
    }
    hudShow(p);
  }

  /* ---------- Сборная ---------- */
  async function tournament(p, name) {
    var nat = p.nation;
    var base = NAT[nat].s, cont = NAT[nat].c;
    var mys = clamp(Math.trunc(base + (overall(p) - 75) * 0.3), 40, 99);
    var others = NATIONS.filter(function (n) { return n.n !== nat; });
    var pool;
    if (name === "Чемпионат мира") {
      pool = others;
    } else {
      var same = others.filter(function (n) { return n.c === cont; });
      var extra = others.filter(function (n) { return n.c !== cont; }).sort(function (a, b) { return b.s - a.s; });
      pool = same.concat(extra.slice(0, Math.max(0, 12 - same.length)));
    }
    var top = pool.slice().sort(function (a, b) { return b.s - a.s; }).slice(0, Math.max(5, Math.floor(pool.length / 2)));
    var role = getRole(p, mys);
    var year = p.year + 1;

    say("\n" + "=".repeat(20));
    say(">>>", name.toUpperCase(), year, "| сборная", nat, "(сила " + mys + ")");
    await chooseMode();

    var pts = 0, goals = 0, played = 0;
    var grp = sample(pool, 3);
    for (var k = 0; k < grp.length; k++) {
      var o = grp[k];
      var r = await playMatch(p, role, nat, o.n, o.s, mys, "Группа " + (k + 1) + "/3");
      pts += PTS[r.res];
      goals += r.mg;
      if (r.rating) played += 1;
    }

    var reached = 0, won = false;
    if (pts >= 4 || (pts === 3 && Math.random() < 0.5)) {
      say("Сборная вышла из группы!");
      var stages = ["1/8 финала", "1/4 финала", "полуфинал", "ФИНАЛ"];
      var knocked = false;
      for (var i = 0; i < stages.length; i++) {
        var st = stages[i];
        var o2 = pick(i < 2 ? pool : top);
        var r2 = await playMatch(p, role, nat, o2.n, o2.s, mys, st, true);
        goals += r2.mg;
        if (r2.rating) played += 1;
        if (!r2.adv) {
          say("Сборная выбыла на стадии:", st);
          knocked = true;
          break;
        }
        reached += 1;
      }
      if (!knocked) won = true;
    } else {
      say("Сборная не вышла из группы");
    }

    state.auto = false;
    var c = p.career;
    c.caps += played;
    c.nat_goals += goals;
    say("Матчей за сборную на турнире:", played, "| голов:", goals);
    if (won) {
      say("*** СБОРНАЯ -", nat.toUpperCase(), "- ЧЕМПИОН! ТЫ ГЕРОЙ СТРАНЫ! ***");
      c.trophies.push(name + " " + year);
      p.rep += name === "Чемпионат мира" ? 40 : 25;
    } else {
      p.rep += [0, 2, 4, 7, 0][reached];
    }
  }

  async function national(p) {
    var ov = overall(p);
    if (p.age < 18 || ov < 68) return;
    var caps = rnd(3, 8);
    var ng = rnd(0, { "Нападающий": 4, "Полузащитник": 2, "Защитник": 1, "Вратарь": 0 }[p.pos]);
    p.career.caps += caps;
    p.career.nat_goals += ng;
    say("\n--- СБОРНАЯ", p.nation, "--- отборочные и товарищеские:", caps, "матчей | голов:", ng);
    var endYear = p.year + 1;
    if (endYear % 4 === 2) await tournament(p, "Чемпионат мира");
    else if (endYear % 4 === 0) await tournament(p, CONT_CUP[NAT[p.nation].c]);
  }

  /* ---------- Возраст, прорыв, трансферы, магазин ---------- */
  function ageUp(p) {
    p.age += 1;
    var a = p.age + (ARCH_AGE_SHIFT[p.arch || "normal"] || 0);
    if (p.pos === "Вратарь") {
      // вратари стареют позже
      var ga = a - 3;
      if (ga >= 32) p.agility = Math.max(20, p.agility - rnd(0, 2));
      if (ga >= 34) {
        p.reflex = Math.max(20, p.reflex - rnd(0, 2));
        p.aerial = Math.max(20, p.aerial - rnd(0, 1));
      }
      if (ga >= 36) {
        p.handling = Math.max(20, p.handling - rnd(0, 1));
        p.position = Math.max(20, p.position - rnd(0, 1));
      }
      return;
    }
    if (a >= 30) p.pace = Math.max(20, p.pace - rnd(0, 2));
    if (a >= 33) {
      p.pace = Math.max(20, p.pace - rnd(1, 2));
      p.power = Math.max(20, p.power - rnd(0, 2));
      p.dribble = Math.max(20, p.dribble - rnd(0, 1));
    }
    if (a >= 35) {
      ["shot", "pass", "defense"].forEach(function (k) { p[k] = Math.max(20, p[k] - rnd(0, 2)); });
    }
  }

  function breakout(p) {
    var arch = p.arch || "normal";
    if ((arch !== "late" && arch !== "hidden") || p.boomed || p.age < (p.boom || 99)) return;
    p.boomed = true;
    var before = overall(p);
    keysOf(p).forEach(function (k) { p[k] = Math.max(p[k], Math.min(p.pot, p[k] + rnd(4, 8))); });
    p.rep += 8;
    if (arch === "hidden") say("\n*** ПРОРЫВ! Твой талант наконец раскрылся: тренеры и скауты заметили тебя! ***");
    else say("\n*** ПОЗДНИЙ РАСЦВЕТ! В", p.age, "лет ты вышел на пик формы! ***");
    say("Рейтинг:", before, "->", overall(p));
    hudShow(p);
  }

  async function pickClub(p, limit) {
    var cur = p.club.n;
    while (true) {
      var avail = {};
      CLUBS.forEach(function (c) {
        if (c.n !== cur && c.s <= limit) (avail[c.lg] = avail[c.lg] || []).push(c);
      });
      if (!Object.keys(avail).length) {
        say("Пока никто не готов тебя взять.");
        return null;
      }
      say("\nВыбери лигу (клубы до силы " + Math.floor(limit) + "):");
      var lg = await UI.choose(LEAGUE_NAMES.filter(function (x) { return avail[x]; }).map(function (x) { return [x, x]; }).concat([["← Назад", "BACK"]]));
      if (lg === "BACK") return null;
      say("Выбери клуб:");
      var cl = avail[lg].slice().sort(function (a, b) { return b.s - a.s; });
      var cn = await UI.choose(cl.map(function (c) { return [c.n + " сила " + c.s + ", " + salary(p, c) + " тыс. €", c.n]; }).concat([["← Назад", "BACK"]]));
      if (cn === "BACK") continue;
      return cl.filter(function (c) { return c.n === cn; })[0];
    }
  }

  async function transfer(p) {
    var ov = overall(p);
    var limit = ov + p.rep * 0.15 + 10;
    var pool = CLUBS.filter(function (c) { return c.n !== p.club.n && ov - 30 <= c.s && c.s <= limit; });
    var offers = sample(pool, Math.min(4, pool.length));
    say("\n--- ТРАНСФЕРНОЕ ОКНО ---");
    var opts = [["Остаться: " + p.club.n + " (сила " + p.club.s + ", " + salary(p, p.club) + " тыс. €)", "0"]];
    offers.forEach(function (c, i) {
      opts.push([c.n + " [" + c.lg + "] сила " + c.s + ", " + salary(p, c) + " тыс. €", String(i + 1)]);
    });
    opts.push(["Выбрать клуб самому", "PICK"]);
    while (true) {
      var ch = await UI.choose(opts);
      if (ch === "PICK") {
        var club = await pickClub(p, limit);
        if (club) {
          p.club = { n: club.n, s: club.s, lg: club.lg };
          say("Ты перешёл в", p.club.n, "(" + p.club.lg + ")");
          hudShow(p);
          return;
        }
        continue;
      }
      if (ch !== "0") {
        var o = offers[parseInt(ch, 10) - 1];
        p.club = { n: o.n, s: o.s, lg: o.lg };
        say("Ты перешёл в", p.club.n, "(" + p.club.lg + ")");
        hudShow(p);
      }
      return;
    }
  }

  async function shop(p) {
    var costs = { "1": 300, "2": 200, "3": 500 };
    while (true) {
      hudShow(p);
      say("\n--- РАСХОДЫ --- Деньги:", p.money, "тыс. €");
      var c = await UI.choose([
        ["Личный тренер: +2 занятия (300)", "1"],
        ["Врач: меньше травм (200)", "2"],
        ["Пиар-агент: +5 репутации (500)", "3"],
        ["Дальше", "4"]
      ]);
      if (c === "4") return;
      if (p.money >= costs[c]) {
        p.money -= costs[c];
        if (c === "1") { p.extra += 2; say("Тренер нанят"); }
        else if (c === "2") { p.doc = true; say("Врач нанят"); }
        else { p.rep += 5; say("Агент поработал: репутация +5"); }
      } else {
        say("Не хватает денег");
      }
    }
  }

  /* ---------- Сохранение ---------- */
  function saveGame(p) {
    try { localStorage.setItem(SAVE, JSON.stringify(p)); } catch (e) { /* ignore */ }
  }
  function loadGame() {
    try {
      var raw = localStorage.getItem(SAVE);
      if (!raw) return null;
      var p = JSON.parse(raw);
      if (!p || !p.club || !p.career || !WEIGHTS[p.pos]) return null;
      if (!p.nation || !NAT[p.nation]) p.nation = "Россия";
      if (p.qual === undefined) p.qual = null;
      if (!p.arch) p.arch = "normal";
      if (!p.height) p.height = 180;
      if (!p.weight) p.weight = 78;
      if (p.career.saves === undefined) p.career.saves = 0;
      if (p.career.clean === undefined) p.career.clean = 0;
      if (p.boom === undefined) p.boom = 99;
      if (p.boomed === undefined) p.boomed = false;
      return p;
    } catch (e) {
      return null;
    }
  }
  function dropSave() {
    try { localStorage.removeItem(SAVE); } catch (e) { /* ignore */ }
  }

  /* ---------- Финал и цикл карьеры ---------- */
  function finish(p) {
    var c = p.career;
    say("\n==============================");
    say("КАРЬЕРА ЗАВЕРШЕНА:", p.name, "|", p.pos, "|", p.nation);
    say("Сезонов:", c.seasons, "| Матчей:", c.matches);
    if (p.pos === "Вратарь") say("Сейвов:", c.saves || 0, "| Сухих матчей:", c.clean || 0);
    else say("Голов:", c.goals, "| Ассистов:", c.assists);
    say("Сборная: матчей", c.caps, "| голов", c.nat_goals);
    say("Золотых мячей:", c.ballon, "| Трофеев:", c.trophies.length);
    c.trophies.forEach(function (t) { say("  -", t); });
    say("Накоплено:", p.money, "тыс. €");
    var score = c.goals + c.assists * 0.5 + (c.saves || 0) * 0.1 + (c.clean || 0) * 1.5 + c.trophies.length * 10 + c.ballon * 50 + c.caps * 0.3;
    var verdict;
    if (score > 250) verdict = "ЛЕГЕНДА ФУТБОЛА";
    else if (score > 120) verdict = "Звезда мирового уровня";
    else if (score > 50) verdict = "Крепкий профессионал";
    else verdict = "Обычная карьера";
    say("*** Итог:", verdict, "***");
    dropSave();
  }

  async function career(p) {
    while (true) {
      UI.clear();
      say("СЕЗОН", seasonLabel(p));
      showPlayer(p);
      await train(p);
      await playSeason(p);
      await national(p);
      ageUp(p);
      p.year += 1;
      breakout(p);
      hudShow(p);

      var maxAge = (p.arch === "normal" || p.arch === "early" || !p.arch) ? 38 : 40;
      if (p.age >= maxAge) {
        say("\nТебе " + maxAge + ". Пора на пенсию.");
        finish(p);
        return true;
      }
      if (p.age >= 34) {
        var a = await UI.choose([["Завершить карьеру", "yes"], ["Играть дальше", "no"]]);
        if (a === "yes") {
          finish(p);
          return true;
        }
      }

      await transfer(p);
      await shop(p);
      saveGame(p);
      say("\nКарьера сохранена");
      var a2 = await UI.choose([["Следующий сезон", "go"], ["Сохранить и выйти", "exit"]]);
      if (a2 === "exit") return false;
    }
  }

  async function game() {
    while (true) {
      var p = null;
      var saved = loadGame();
      if (saved) {
        say("Найдено сохранение.");
        var a = await UI.choose([["Продолжить карьеру", "yes"], ["Новая карьера", "no"]]);
        if (a === "yes") p = saved;
      }
      if (!p) p = await newPlayer();
      var retired = await career(p);
      if (!retired) {
        say("Прогресс сохранён. Можно закрыть страницу.");
        return;
      }
      var a3 = await UI.choose([["Новая карьера", "yes"], ["Выход", "no"]]);
      if (a3 === "no") return;
    }
  }

  async function main() {
    while (true) {
      UI.clear();
      say("=== КАРЬЕРА ФУТБОЛИСТА ===");
      await game();
      await UI.choose([["В главное меню", "menu"]]);
      hudHide();
    }
  }

  window.__G = { game: game, UI: UI, state: state, overall: overall, hudShow: function (p) { }, newPlayer: newPlayer };
  if (!window.__TEST) main();
})();
</script>
